<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattwise — redirecting</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://newest-destiny-disk-nicole.trycloudflare.com">
<link rel="canonical" href="https://newest-destiny-disk-nicole.trycloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#FFFFFF; --surface-2:#F4F4F9; --ink:#22243F; --muted:#6B6D8C;
    --indigo:#5B5F97; --periwinkle:#B8B8D1; --cheap:#FFC145;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--surface-2); color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:grid; place-items:center; padding:24px; line-height:1.6;
  }
  .card{
    background:var(--surface); border-radius:28px; padding:40px;
    max-width:34rem; width:100%; text-align:center;
    box-shadow:0 1px 2px rgba(34,36,63,.06), 0 12px 32px rgba(34,36,63,.08);
  }
  h1{
    font-family:Caprasimo,Georgia,serif; font-weight:400;
    font-size:clamp(28px,6vw,38px); margin:0 0 12px; color:var(--indigo);
  }
  p{margin:0 0 24px; color:var(--muted); font-size:17px}
  a.go{
    display:inline-block; background:var(--cheap); color:#22243F;
    text-decoration:none; font-weight:600; font-size:17px;
    padding:14px 28px; border-radius:999px;
  }
  a.go:hover{filter:brightness(.96)}
  a.go:focus-visible{outline:3px solid var(--indigo); outline-offset:3px}
  .url{
    margin-top:24px; font-size:13px; color:var(--muted);
    word-break:break-all; font-variant-numeric:tabular-nums;
  }
  .dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--cheap); margin-right:8px; vertical-align:middle;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <h1>Wattwise</h1>
    <p><span class="dot" aria-hidden="true"></span>Taking you to the live demo&hellip;</p>
    <a class="go" href="https://newest-destiny-disk-nicole.trycloudflare.com">Continue to Wattwise</a>
    <p class="url">If nothing happens, open<br><strong>https://newest-destiny-disk-nicole.trycloudflare.com</strong></p>
  </main>
  <script>location.replace("https://newest-destiny-disk-nicole.trycloudflare.com");</script>
</body>
</html>
